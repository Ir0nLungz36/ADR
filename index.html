<!DOCTYPE html>
<html>
<head>
  <title>Regime Dashboard</title>
  <style>
    body { background:#08090c; color:white; font-family:Arial; padding:24px; }
    input, button { padding:10px; border-radius:8px; border:1px solid #333; margin:4px; }
    input { background:#11141b; color:white; width:260px; }
    button { background:#1f6feb; color:white; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px; }
    .card { background:#12141a; border:1px solid #272b35; border-radius:14px; padding:18px; }
    .score { font-size:52px; font-weight:bold; }
    .good { color:#35d07f; }
    .warn { color:#f5c542; }
    .bad { color:#ff5c5c; }
    .muted { color:#9ca3af; }
    pre { white-space:pre-wrap; color:#ff8080; }
  </style>
</head>

<body>

<h1>Regime Dashboard</h1>

<div class="card">
  <h2>Inputs</h2>
  <input id="apiKeyInput" type="password" placeholder="Massive API key">
  <input id="vixInput" type="number" step="0.01" placeholder="Manual VIX">
  <button onclick="saveAndRun()">Save & Run</button>
  <button onclick="clearInputs()">Clear</button>
  <p id="status" class="muted">Waiting...</p>
</div>

<div class="grid">
  <div class="card">
    <h2>Regime Card</h2>
    <div id="regime">Waiting...</div>
  </div>

  <div class="card">
    <h2>Market Health Score</h2>
    <div id="health" class="score">--</div>
  </div>

  <div class="card">
    <h2>Manual VIX</h2>
    <div id="vix">Waiting...</div>
  </div>
</div>

<h2>Core Market Reads</h2>
<div id="core" class="grid"></div>

<h2>Top 3 Leadership</h2>
<div id="leaders" class="grid"></div>

<div class="card">
  <h2>Error Log</h2>
  <pre id="errors">None</pre>
</div>

<script>
let API_KEY = localStorage.getItem("MASSIVE_API_KEY") || "";
let MANUAL_VIX = localStorage.getItem("MANUAL_VIX") || "";

const TICKERS = ["SPY", "QQQ", "IWM", "XLK", "SOXX"];

document.getElementById("apiKeyInput").value = API_KEY;
document.getElementById("vixInput").value = MANUAL_VIX;

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

function setError(msg) {
  document.getElementById("errors").innerText = msg || "None";
}

function saveAndRun() {
  API_KEY = document.getElementById("apiKeyInput").value.trim();
  MANUAL_VIX = document.getElementById("vixInput").value.trim();

  if (!API_KEY) return setStatus("Paste your Massive API key first.");
  if (!MANUAL_VIX) return setStatus("Enter manual VIX price first.");

  localStorage.setItem("MASSIVE_API_KEY", API_KEY);
  localStorage.setItem("MANUAL_VIX", MANUAL_VIX);

  run();
}

function clearInputs() {
  localStorage.removeItem("MASSIVE_API_KEY");
  localStorage.removeItem("MANUAL_VIX");

  API_KEY = "";
  MANUAL_VIX = "";

  document.getElementById("apiKeyInput").value = "";
  document.getElementById("vixInput").value = "";

  setStatus("Inputs cleared.");
}

async function massiveSnapshot() {
  const tickers = TICKERS.join(",");
  const url =
    `https://api.massive.com/v3/snapshot?ticker.any_of=${tickers}&market=stocks&apiKey=${encodeURIComponent(API_KEY)}`;

  const r = await fetch(url);
  const data = await r.json();

  if (!r.ok || data.status === "ERROR" || data.status === "NOT_AUTHORIZED") {
    throw new Error(JSON.stringify(data, null, 2));
  }

  return data;
}

function readSnapshot(item) {
  const ticker = item.ticker || item.symbol;

  const price =
    item.session?.price ??
    item.session?.close ??
    item.day?.c ??
    item.day?.close ??
    item.min?.c ??
    item.prevDay?.c ??
    0;

  const prevClose =
    item.prevDay?.c ??
    item.previousClose ??
    0;

  let changePercent =
    item.todaysChangePerc ??
    item.session?.change_percent ??
    item.session?.changePercent ??
    0;

  if (!changePercent && price && prevClose) {
    changePercent = ((price - prevClose) / prevClose) * 100;
  }

  const volume =
    item.session?.volume ??
    item.day?.v ??
    item.day?.volume ??
    item.min?.v ??
    0;

  const high =
    item.day?.h ??
    item.session?.high ??
    item.min?.h ??
    0;

  const low =
    item.day?.l ??
    item.session?.low ??
    item.min?.l ??
    0;

  return {
    ticker,
    price,
    prevClose,
    changePercent,
    volume,
    high,
    low,
    dollarVol: price * volume
  };
}

function percentScore(change) {
  if (change >= 2.5) return 100;
  if (change >= 1.5) return 90;
  if (change >= 0.75) return 75;
  if (change >= 0.25) return 60;
  if (change > -0.25) return 50;
  if (change > -0.75) return 40;
  if (change > -1.5) return 25;
  return 10;
}

function vixScore(vix) {
  if (vix < 13) return 95;
  if (vix < 16) return 85;
  if (vix < 20) return 70;
  if (vix < 25) return 45;
  if (vix < 30) return 25;
  return 10;
}

function regimeLabel(score, vix, leader) {
  if (score >= 80 && vix < 20) return `RISK ON / ${leader} LEADERSHIP`;
  if (score >= 65) return `SELECTIVE LONGS / ${leader} LEADERSHIP`;
  if (score >= 45) return "CHOP / WAIT FOR CONFIRMATION";
  if (score >= 30) return "DEFENSIVE / REDUCE SIZE";
  return "RISK OFF / PUTS FAVORED";
}

function classForScore(score) {
  if (score >= 75) return "good";
  if (score >= 45) return "warn";
  return "bad";
}

async function run() {
  try {
    setError("");
    setStatus("Loading one Massive snapshot call...");

    const vix = parseFloat(MANUAL_VIX);
    const data = await massiveSnapshot();

    const reads = (data.results || [])
      .map(readSnapshot)
      .filter(x => TICKERS.includes(x.ticker))
      .map(x => ({
        ...x,
        score: percentScore(Number(x.changePercent || 0))
      }));

    const byTicker = {};
    reads.forEach(x => byTicker[x.ticker] = x);

    const vixHealth = vixScore(vix);

    const health = Math.round(
      (byTicker.SPY?.score || 50)  * 0.20 +
      (byTicker.QQQ?.score || 50)  * 0.25 +
      (byTicker.IWM?.score || 50)  * 0.10 +
      (byTicker.XLK?.score || 50)  * 0.20 +
      (byTicker.SOXX?.score || 50) * 0.15 +
      vixHealth                   * 0.10
    );

    const leaders = [...reads].sort((a,b) => b.score - a.score);
    const leader = leaders[0]?.ticker || "NO";

    document.getElementById("health").innerHTML =
      `<span class="${classForScore(health)}">${health}</span>`;

    document.getElementById("regime").innerHTML =
      `<h3 class="${classForScore(health)}">${regimeLabel(health, vix, leader)}</h3>
       <p class="muted">One API call: SPY, QQQ, IWM, XLK, SOXX + manual VIX.</p>`;

    document.getElementById("vix").innerHTML =
      `${vix.toFixed(2)} | VIX Score: ${vixHealth}/100`;

    document.getElementById("core").innerHTML = reads.map(x => `
      <div class="card">
        <h2>${x.ticker}</h2>
        <p>Current: $${Number(x.price).toFixed(2)}</p>
        <p>Prev Close: $${Number(x.prevClose).toFixed(2)}</p>
        <p>Day Change: <span class="${x.changePercent >= 0 ? "good" : "bad"}">${Number(x.changePercent).toFixed(2)}%</span></p>
        <p>High / Low: $${Number(x.high).toFixed(2)} / $${Number(x.low).toFixed(2)}</p>
        <p>Score: ${x.score}/100</p>
        <p>Volume: ${Number(x.volume).toLocaleString()}</p>
        <p>Dollar Vol: $${(x.dollarVol / 1000000000).toFixed(2)}B</p>
      </div>
    `).join("");

    document.getElementById("leaders").innerHTML = leaders.slice(0,3).map((x,i) => `
      <div class="card">
        <h2>${i + 1}. ${x.ticker}</h2>
        <p>Score: ${x.score}/100</p>
        <p>Change: ${Number(x.changePercent).toFixed(2)}%</p>
        <p>Current: $${Number(x.price).toFixed(2)}</p>
      </div>
    `).join("");

    setStatus("Loaded successfully. Only 1 API request used.");
  } catch (err) {
    setStatus("Failed to load. Check Error Log.");
    setError(err.message);
  }
}

if (API_KEY && MANUAL_VIX) {
  run();
}
</script>

</body>
</html>
