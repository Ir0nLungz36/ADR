<!DOCTYPE html>
<html>
<head>
  <title>Massive Regime Dashboard</title>
  <style>
    body { background:#08090c; color:white; font-family:Arial; padding:24px; }
    input, button { padding:10px; border-radius:8px; border:1px solid #333; }
    input { width:260px; background:#11141b; color:white; margin:4px; }
    button { background:#1f6feb; color:white; cursor:pointer; margin:4px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px; }
    .card { background:#12141a; border:1px solid #272b35; border-radius:14px; padding:18px; }
    .score { font-size:44px; font-weight:bold; }
    .muted { color:#9ca3af; }
    .good { color:#35d07f; }
    .warn { color:#f5c542; }
    .bad { color:#ff5c5c; }
    pre { white-space:pre-wrap; color:#ff8080; }
  </style>
</head>

<body>

<h1>Massive Regime Dashboard v2</h1>

<div class="card">
  <h2>Inputs</h2>
  <input id="apiKeyInput" type="password" placeholder="Paste Massive API key">
  <input id="vixInput" type="number" step="0.01" placeholder="Manual VIX price">
  <button onclick="saveAndRun()">Save & Run</button>
  <button onclick="clearInputs()">Clear</button>
  <p id="status" class="muted">Waiting...</p>
</div>

<div class="grid">
  <div class="card"><h2>Regime Card</h2><div id="regime">Waiting...</div></div>
  <div class="card"><h2>Manual VIX</h2><div id="vix">Waiting...</div></div>
  <div class="card"><h2>Market Health Score</h2><div id="health" class="score">--</div></div>
</div>

<h2>Core Market Reads</h2>
<div id="coreCards" class="grid"></div>

<h2>Top 3 Candidates Only</h2>
<div id="candidates" class="grid"></div>

<div class="card">
  <h2>Error Log</h2>
  <pre id="errors">None</pre>
</div>

<script>
let API_KEY = localStorage.getItem("MASSIVE_API_KEY") || "";
let MANUAL_VIX = localStorage.getItem("MANUAL_VIX") || "";

const TICKERS = ["SPY", "QQQ", "IWM", "XLK", "SOXX"];
const DELAY_MS = 1300;

document.getElementById("apiKeyInput").value = API_KEY;
document.getElementById("vixInput").value = MANUAL_VIX;

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

function setError(msg) {
  document.getElementById("errors").innerText = msg || "None";
}

function saveAndRun() {
  API_KEY = document.getElementById("apiKeyInput").value.trim();
  MANUAL_VIX = document.getElementById("vixInput").value.trim();

  if (!API_KEY) return setStatus("Paste your Massive API key first.");
  if (!MANUAL_VIX) return setStatus("Enter manual VIX price first.");

  localStorage.setItem("MASSIVE_API_KEY", API_KEY);
  localStorage.setItem("MANUAL_VIX", MANUAL_VIX);

  run();
}

function clearInputs() {
  localStorage.removeItem("MASSIVE_API_KEY");
  localStorage.removeItem("MANUAL_VIX");
  API_KEY = "";
  MANUAL_VIX = "";
  document.getElementById("apiKeyInput").value = "";
  document.getElementById("vixInput").value = "";
  setStatus("Inputs cleared.");
}

async function massive(url, delay = true) {
  const joiner = url.includes("?") ? "&" : "?";
  const fullUrl = `${url}${joiner}apiKey=${encodeURIComponent(API_KEY)}`;

  const r = await fetch(fullUrl);
  const data = await r.json();

  if (!r.ok || data.status === "ERROR" || data.status === "NOT_AUTHORIZED") {
    throw new Error(JSON.stringify(data, null, 2));
  }

  if (delay) await sleep(DELAY_MS);
  return data;
}

/* Real-time/current ticker data */
async function getSnapshot() {
  const tickers = TICKERS.join(",");
  return await massive(
    `https://api.massive.com/v3/snapshot?ticker.any_of=${tickers}`,
    true
  );
}

/* Historical bars for trend + ADR */
async function getDaily(ticker) {
  const to = new Date().toISOString().slice(0,10);
  const from = new Date(Date.now() - 70*86400000).toISOString().slice(0,10);

  return await massive(
    `https://api.massive.com/v2/aggs/ticker/${ticker}/range/1/day/${from}/${to}?adjusted=true&sort=asc&limit=70`,
    true
  );
}

function normalizeSnapshot(results) {
  const map = {};

  for (const r of results || []) {
    const ticker = r.ticker;

    const session = r.session || {};
    const day = r.day || {};

    const price =
      session.close ||
      session.price ||
      day.close ||
      r.value ||
      0;

    const open =
      session.open ||
      day.open ||
      0;

    const high =
      session.high ||
      day.high ||
      0;

    const low =
      session.low ||
      day.low ||
      0;

    const volume =
      session.volume ||
      day.volume ||
      0;

    const changePercent =
      session.change_percent ||
      session.changePercent ||
      r.todaysChangePerc ||
      0;

    map[ticker] = {
      ticker,
      price,
      open,
      high,
      low,
      volume,
      changePercent
    };
  }

  return map;
}

function trendScore(bars) {
  if (!bars || bars.length < 21) return 50;

  const close = bars[bars.length - 1].c;
  const c5 = bars[bars.length - 6].c;
  const c20 = bars[bars.length - 21].c;

  let score = 50;
  if (close > c5) score += 20;
  else score -= 15;

  if (close > c20) score += 20;
  else score -= 15;

  return Math.max(0, Math.min(100, score));
}

function adr20(bars) {
  if (!bars || bars.length < 20) return 0;

  const recent = bars.slice(-20);
  const ranges = recent.map(b => ((b.h - b.l) / b.c) * 100);

  return ranges.reduce((a,b) => a + b, 0) / ranges.length;
}

function vixScore(vix) {
  if (vix < 13) return 95;
  if (vix < 16) return 85;
  if (vix < 20) return 70;
  if (vix < 25) return 45;
  if (vix < 30) return 25;
  return 10;
}

function regimeLabel(score, vix, leader) {
  if (score >= 80 && vix < 20) return `RISK ON / ${leader} LEADERSHIP`;
  if (score >= 65) return `SELECTIVE LONGS / ${leader} LEADERSHIP`;
  if (score >= 45) return "CHOP / WAIT FOR CONFIRMATION";
  if (score >= 30) return "DEFENSIVE / REDUCE SIZE";
  return "RISK OFF / PUTS FAVORED";
}

function scoreCandidate(ticker, bars, snap) {
  const last = bars[bars.length - 1];
  const price = snap?.price || last.c;
  const adr = adr20(bars);

  const high = snap?.high || last.h;
  const low = snap?.low || last.l;
  const volume = snap?.volume || last.v;

  const rangeToday = ((high - low) / price) * 100;
  const compression = adr ? rangeToday / adr : 1;
  const dollarVol = price * volume;
  const trend = trendScore(bars);
  const dayChange = snap?.changePercent || 0;

  let score = 0;

  if (adr >= 1.2) score += 15;
  if (compression <= 0.75) score += 20;
  if (dollarVol >= 1000000000) score += 20;
  if (dayChange > 0) score += 15;
  if (dayChange > 1) score += 10;

  score += trend * 0.20;

  return {
    ticker,
    score: Math.round(score),
    price: price.toFixed(2),
    change: dayChange.toFixed(2),
    adr: adr.toFixed(2),
    compression: compression.toFixed(2),
    dollarVol: (dollarVol / 1000000000).toFixed(2),
    trend
  };
}

async function run() {
  try {
    setError("");
    setStatus("Loading real-time snapshots + trend bars...");

    const vix = parseFloat(MANUAL_VIX);

    const snapshotData = await getSnapshot();
    const snapMap = normalizeSnapshot(snapshotData.results || []);

    const dailyMap = {};

    for (const ticker of TICKERS) {
      setStatus(`Loading ${ticker} daily trend...`);
      const data = await getDaily(ticker);
      dailyMap[ticker] = data.results || [];
    }

    const reads = TICKERS.map(ticker =>
      scoreCandidate(ticker, dailyMap[ticker], snapMap[ticker])
    );

    const byTicker = {};
    reads.forEach(r => byTicker[r.ticker] = r);

    const vixHealth = vixScore(vix);

    const health = Math.round(
      byTicker.SPY.score  * 0.20 +
      byTicker.QQQ.score  * 0.25 +
      byTicker.IWM.score  * 0.10 +
      byTicker.XLK.score  * 0.15 +
      byTicker.SOXX.score * 0.20 +
      vixHealth          * 0.10
    );

    const leader = reads
      .filter(x => ["QQQ","XLK","SOXX"].includes(x.ticker))
      .sort((a,b) => b.score - a.score)[0].ticker;

    const regime = regimeLabel(health, vix, leader);

    document.getElementById("vix").innerHTML =
      `${vix.toFixed(2)} | VIX Score: ${vixHealth}/100`;

    document.getElementById("health").innerHTML = health;
    document.getElementById("regime").innerHTML = regime;

    document.getElementById("coreCards").innerHTML = reads.map(x => `
      <div class="card">
        <h2>${x.ticker}</h2>
        <p>Current: $${x.price}</p>
        <p>Day Change: ${x.change}%</p>
        <p>Trend: ${x.trend}/100</p>
        <p>ADR20: ${x.adr}%</p>
        <p>Compression: ${x.compression}</p>
        <p>Dollar Vol: $${x.dollarVol}B</p>
        <h3>Score: ${x.score}/100</h3>
      </div>
    `).join("");

    const top3 = reads.sort((a,b) => b.score - a.score).slice(0,3);

    document.getElementById("candidates").innerHTML = top3.map((x,i) => `
      <div class="card">
        <h2>${i + 1}. ${x.ticker} — ${x.score}/100</h2>
        <p>Current: $${x.price}</p>
        <p>Day Change: ${x.change}%</p>
        <p>Trend: ${x.trend}/100</p>
        <p>ADR20: ${x.adr}%</p>
        <p>Compression: ${x.compression}</p>
      </div>
    `).join("");

    setStatus("Dashboard loaded. API tickers: SPY, QQQ, IWM, XLK, SOXX. VIX manual.");
  } catch (err) {
    setStatus("Failed to load. Check Error Log.");
    setError(err.message);
  }
}

if (API_KEY && MANUAL_VIX) {
  run();
}
</script>

</body>
</html>
