<!DOCTYPE html>
<html>
<head>
  <title>Massive Regime Dashboard</title>
  <style>
    body { background:#08090c; color:white; font-family:Arial; padding:24px; }
    input, button { padding:10px; border-radius:8px; border:1px solid #333; }
    input { width:260px; background:#11141b; color:white; margin:4px; }
    button { background:#1f6feb; color:white; cursor:pointer; margin:4px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px; }
    .card { background:#12141a; border:1px solid #272b35; border-radius:14px; padding:18px; }
    .score { font-size:44px; font-weight:bold; }
    .muted { color:#9ca3af; }
    .good { color:#35d07f; }
    .warn { color:#f5c542; }
    .bad { color:#ff5c5c; }
    pre { white-space:pre-wrap; color:#ff8080; }
  </style>
</head>

<body>

<h1>Massive Regime Dashboard</h1>

<div class="card">
  <h2>Inputs</h2>

  <input id="apiKeyInput" type="password" placeholder="Paste Massive API key">
  <input id="vixInput" type="number" step="0.01" placeholder="Manual VIX price">

  <button onclick="saveAndRun()">Save & Run</button>
  <button onclick="clearInputs()">Clear</button>

  <p id="status" class="muted">Waiting...</p>
</div>

<div class="grid">
  <div class="card"><h2>Regime Card</h2><div id="regime">Waiting...</div></div>
  <div class="card"><h2>Manual VIX</h2><div id="vix">Waiting...</div></div>
  <div class="card"><h2>SPY</h2><div id="spy">Waiting...</div></div>
  <div class="card"><h2>QQQ</h2><div id="qqq">Waiting...</div></div>
  <div class="card"><h2>IWM</h2><div id="iwm">Waiting...</div></div>
  <div class="card"><h2>Market Health Score</h2><div id="health" class="score">--</div></div>
</div>

<h2>Top 3 Candidates Only</h2>
<div id="candidates" class="grid"></div>

<div class="card">
  <h2>Error Log</h2>
  <pre id="errors">None</pre>
</div>

<script>
let API_KEY = localStorage.getItem("MASSIVE_API_KEY") || "";
let MANUAL_VIX = localStorage.getItem("MANUAL_VIX") || "";

const TICKERS = ["SPY", "QQQ", "IWM"];
const DELAY_MS = 1400;

document.getElementById("apiKeyInput").value = API_KEY;
document.getElementById("vixInput").value = MANUAL_VIX;

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

function setError(msg) {
  document.getElementById("errors").innerText = msg || "None";
}

function saveAndRun() {
  API_KEY = document.getElementById("apiKeyInput").value.trim();
  MANUAL_VIX = document.getElementById("vixInput").value.trim();

  if (!API_KEY) {
    setStatus("Paste your Massive API key first.");
    return;
  }

  if (!MANUAL_VIX) {
    setStatus("Enter manual VIX price first.");
    return;
  }

  localStorage.setItem("MASSIVE_API_KEY", API_KEY);
  localStorage.setItem("MANUAL_VIX", MANUAL_VIX);

  run();
}

function clearInputs() {
  localStorage.removeItem("MASSIVE_API_KEY");
  localStorage.removeItem("MANUAL_VIX");

  API_KEY = "";
  MANUAL_VIX = "";

  document.getElementById("apiKeyInput").value = "";
  document.getElementById("vixInput").value = "";

  setStatus("Inputs cleared.");
}

async function massive(url) {
  const joiner = url.includes("?") ? "&" : "?";
  const fullUrl = `${url}${joiner}apiKey=${encodeURIComponent(API_KEY)}`;

  const r = await fetch(fullUrl);
  const data = await r.json();

  if (!r.ok || data.status === "ERROR" || data.status === "NOT_AUTHORIZED") {
    throw new Error(JSON.stringify(data, null, 2));
  }

  await sleep(DELAY_MS);
  return data;
}

async function getDaily(ticker) {
  const to = new Date().toISOString().slice(0,10);
  const from = new Date(Date.now() - 70*86400000).toISOString().slice(0,10);

  return await massive(
    `https://api.massive.com/v2/aggs/ticker/${ticker}/range/1/day/${from}/${to}?adjusted=true&sort=asc&limit=70`
  );
}

function trendScore(bars) {
  if (!bars || bars.length < 21) return 50;

  const last = bars[bars.length - 1];
  const close = last.c;
  const c5 = bars[bars.length - 6].c;
  const c20 = bars[bars.length - 21].c;

  let score = 50;

  if (close > c5) score += 20;
  else score -= 15;

  if (close > c20) score += 20;
  else score -= 15;

  return Math.max(0, Math.min(100, score));
}

function adr20(bars) {
  if (!bars || bars.length < 20) return 0;

  const recent = bars.slice(-20);
  const ranges = recent.map(b => ((b.h - b.l) / b.c) * 100);

  return ranges.reduce((a,b) => a + b, 0) / ranges.length;
}

function vixScore(vix) {
  if (vix < 13) return 95;
  if (vix < 16) return 85;
  if (vix < 20) return 70;
  if (vix < 25) return 45;
  if (vix < 30) return 25;
  return 10;
}

function regimeLabel(score, vix) {
  if (score >= 80 && vix < 20) return "RISK ON / CALLS FAVORED";
  if (score >= 65) return "SELECTIVE LONGS";
  if (score >= 45) return "CHOP / WAIT FOR CONFIRMATION";
  if (score >= 30) return "DEFENSIVE / REDUCE SIZE";
  return "RISK OFF / PUTS FAVORED";
}

function scoreCandidate(ticker, bars) {
  const last = bars[bars.length - 1];
  const adr = adr20(bars);
  const rangeToday = ((last.h - last.l) / last.c) * 100;
  const compression = adr ? rangeToday / adr : 1;
  const dollarVol = last.c * last.v;
  const trend = trendScore(bars);

  let score = 0;

  if (adr >= 1.2) score += 20;
  if (compression <= 0.65) score += 25;
  if (dollarVol >= 1000000000) score += 25;

  score += trend * 0.30;

  return {
    ticker,
    score: Math.round(score),
    price: last.c.toFixed(2),
    adr: adr.toFixed(2),
    compression: compression.toFixed(2),
    dollarVol: (dollarVol / 1000000000).toFixed(2),
    trend
  };
}

async function run() {
  try {
    setError("");
    setStatus("Loading SPY, QQQ, IWM only...");

    const vix = parseFloat(MANUAL_VIX);

    const spyData = await getDaily("SPY");
    const qqqData = await getDaily("QQQ");
    const iwmData = await getDaily("IWM");

    const spyBars = spyData.results || [];
    const qqqBars = qqqData.results || [];
    const iwmBars = iwmData.results || [];

    const spyTrend = trendScore(spyBars);
    const qqqTrend = trendScore(qqqBars);
    const iwmTrend = trendScore(iwmBars);
    const vixHealth = vixScore(vix);

    const health = Math.round(
      spyTrend * 0.30 +
      qqqTrend * 0.30 +
      iwmTrend * 0.20 +
      vixHealth * 0.20
    );

    const regime = regimeLabel(health, vix);

    document.getElementById("spy").innerHTML = `Trend Score: ${spyTrend}/100`;
    document.getElementById("qqq").innerHTML = `Trend Score: ${qqqTrend}/100`;
    document.getElementById("iwm").innerHTML = `Trend Score: ${iwmTrend}/100`;
    document.getElementById("vix").innerHTML = `${vix.toFixed(2)} | VIX Score: ${vixHealth}/100`;
    document.getElementById("health").innerHTML = health;
    document.getElementById("regime").innerHTML = regime;

    const candidates = [
      scoreCandidate("SPY", spyBars),
      scoreCandidate("QQQ", qqqBars),
      scoreCandidate("IWM", iwmBars)
    ].sort((a,b) => b.score - a.score);

    document.getElementById("candidates").innerHTML = candidates.map((x,i) => `
      <div class="card">
        <h2>${i + 1}. ${x.ticker} — ${x.score}/100</h2>
        <p>Price: $${x.price}</p>
        <p>Trend: ${x.trend}/100</p>
        <p>ADR20: ${x.adr}%</p>
        <p>Compression: ${x.compression}</p>
        <p>Dollar Vol: $${x.dollarVol}B</p>
      </div>
    `).join("");

    setStatus("Dashboard loaded. No index/VIX API call used.");
  } catch (err) {
    setStatus("Failed to load. Check Error Log.");
    setError(err.message);
  }
}

if (API_KEY && MANUAL_VIX) {
  run();
}
</script>

</body>
</html>
